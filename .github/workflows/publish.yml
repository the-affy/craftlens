name: Publish CraftLens

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish Extension
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package -- --release

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/vscode-extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CraftLens version: $VERSION"

      - name: Verify VSIX
        shell: bash
        run: |
          VSIX="craftlens-${{ steps.version.outputs.version }}.vsix"

          if [ ! -f "$VSIX" ]; then
            echo "Expected VSIX not found: $VSIX"
            echo "Available VSIX files:"
            ls -lah *.vsix 2>/dev/null || true
            exit 1
          fi

          echo "VSIX found:"
          ls -lh "$VSIX"

      - name: Publish to Visual Studio Marketplace
        run: |
          npx @vscode/vsce publish \
            --oidc \
            --packagePath "craftlens-${{ steps.version.outputs.version }}.vsix"