<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload File Dialog</title>
</head>
<body class="bg-gray-100 p-8 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-lg border shadow-sm p-6 max-w-md w-full">
    <h2 class="text-lg font-semibold mb-2">Upload Dataset</h2>
    <p class="text-sm text-gray-500 mb-4">Select a CSV or JSON file to import records into your database.</p>
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-gray-400 cursor-pointer">
      <span class="text-sm text-gray-600">Drag and drop file here, or click to browse</span>
    </div>
    <div class="mt-6 flex justify-end gap-3">
      <button class="px-3 py-1.5 border rounded text-sm text-gray-600">Cancel</button>
      <button class="px-4 py-1.5 bg-gray-900 text-white rounded text-sm font-medium hover:bg-black">Upload</button>
    </div>
  </div>
</body>
</html>
