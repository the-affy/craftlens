<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Architecture</title>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
  <header class="mb-8">
    <h1 class="text-3xl font-bold tracking-tight">Core Infrastructure Status</h1>
    <p class="text-gray-600">Real-time health of cluster ingress, compute workers, and object storage.</p>
  </header>
  <!-- Bento grid with asymmetric visual weights and purposeful hierarchy -->
  <div class="grid grid-cols-12 gap-6 max-w-6xl">
    <div class="col-span-8 p-6 bg-white rounded-xl border border-gray-200">
      <h2 class="text-xl font-semibold mb-2">Ingress Load Balancer</h2>
      <p class="text-gray-600 text-sm mb-4">Traffic distributed evenly across 3 availability zones.</p>
      <div class="h-32 bg-gray-100 rounded flex items-center justify-center text-xs text-gray-500">Latency Chart (Avg 12ms)</div>
    </div>
    <div class="col-span-4 p-6 bg-white rounded-xl border border-gray-200">
      <h3 class="text-base font-semibold mb-2">Region Health</h3>
      <p class="text-xs text-gray-500">All regions operational.</p>
    </div>
  </div>
</body>
</html>
