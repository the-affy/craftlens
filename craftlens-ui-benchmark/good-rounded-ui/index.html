<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile Settings</title>
</head>
<body class="bg-gray-50 text-gray-900 p-8 max-w-2xl mx-auto">
  <header class="mb-6">
    <h1 class="text-2xl font-bold">Profile Settings</h1>
    <p class="text-gray-500 text-sm">Update your account information and preferences.</p>
  </header>
  <div class="bg-white border border-gray-200 rounded-lg p-6 space-y-4 shadow-sm">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
      <input type="text" value="Jane Doe" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
      <input type="email" value="jane@example.com" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
    </div>
    <div class="pt-4 border-t flex justify-end">
      <button class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700">Save Changes</button>
    </div>
  </div>
</body>
</html>
